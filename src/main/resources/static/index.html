<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect | Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --font-size: 16px;
            --background: #ffffff;
            --foreground: oklch(0.145 0 0);
            --card: #ffffff;
            --card-foreground: oklch(0.145 0 0);
            --primary: #7c3aed;
            --primary-foreground: oklch(1 0 0);
            --secondary: oklch(0.95 0.0058 264.53);
            --secondary-foreground: #030213;
            --muted: #ececf0;
            --muted-foreground: #717182;
            --accent: #e9ebef;
            --accent-foreground: #030213;
            --destructive: #d4183d;
            --destructive-foreground: #ffffff;
            --border: rgba(0, 0, 0, 0.1);
            --input-background: #f3f3f5;
            --radius: 0.625rem;
            --ring: oklch(0.708 0 0);
        }

        .dark {
            --background: oklch(0.145 0 0);
            --foreground: oklch(0.985 0 0);
            --card: oklch(0.145 0 0);
            --card-foreground: oklch(0.985 0 0);
            --primary: #a78bfa;
            --primary-foreground: oklch(0.205 0 0);
            --secondary: oklch(0.269 0 0);
            --secondary-foreground: oklch(0.985 0 0);
            --muted: oklch(0.269 0 0);
            --muted-foreground: oklch(0.708 0 0);
            --border: oklch(0.269 0 0);
            --input-background: oklch(0.269 0 0);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            padding-bottom: 70px;
            /* Space for bottom nav */
            transition: background-color 0.3s;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .header-content {
            width: 100%;
            max-width: 600px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Citizens Scroller */
        .citizens-container {
            border-bottom: 1px solid var(--border);
            background: var(--card);
            padding: 16px 0;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .citizens-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 0 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .citizens-scroll::-webkit-scrollbar {
            display: none;
        }

        .citizen-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            cursor: pointer;
            width: 70px;
            transition: transform 0.2s;
        }

        .citizen-item:hover {
            transform: scale(1.05);
        }

        .citizen-avatar-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, var(--primary), #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .citizen-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--card);
            border: 2px solid var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .citizen-name {
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: var(--foreground);
            opacity: 0.9;
        }

        /* Feed */
        main {
            max-width: 600px;
            margin: 0 auto;
        }

        .post {
            border-bottom: 1px solid var(--border);
            background: var(--card);
            margin-bottom: 8px;
        }

        .post-header {
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--secondary-foreground);
        }

        .post-username {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .post-img-container {
            width: 100%;
            background: var(--muted);
            aspect-ratio: 1/1;
            overflow: hidden;
        }

        .post-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-actions {
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-group {
            display: flex;
            gap: 16px;
        }

        .action-group i {
            cursor: pointer;
            transition: 0.2s;
        }

        .action-group i:hover {
            transform: scale(1.1);
        }

        .action-group i.liked {
            color: var(--destructive);
            fill: var(--destructive);
        }

        .post-info {
            padding: 0 12px 16px;
        }

        .likes-text {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .caption {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .caption-user {
            font-weight: 700;
            margin-right: 6px;
        }

        /* Bottom Nav */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--card);
            border-top: 1px solid var(--border);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .nav-items {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-around;
            padding: 0 16px;
        }

        .nav-item {
            color: var(--foreground);
            opacity: 0.6;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item:hover,
        .nav-item.active {
            opacity: 1;
            color: var(--primary);
        }

        .create-btn-circular {
            width: 44px;
            height: 44px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: -25px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            transition: 0.3s;
        }

        .create-btn-circular:hover {
            transform: translateY(-3px) scale(1.05);
        }

        /* Modals */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            /* Mobile style slide-up */
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--card);
            width: 100%;
            max-width: 600px;
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 24px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-bar {
            width: 40px;
            height: 4px;
            background: var(--muted);
            border-radius: 2px;
            margin: -12px auto 20px;
            cursor: pointer;
        }

        textarea,
        input {
            width: 100%;
            padding: 12px;
            background: var(--input-background);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--foreground);
            margin-bottom: 12px;
            outline: none;
        }

        .btn-post {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .btn-post:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #uploadZone:hover {
            background: var(--accent) !important;
            border-color: var(--primary) !important;
        }

        @media (min-width: 768px) {
            body {
                padding-bottom: 0;
            }

            nav.bottom-nav {
                top: 0;
                bottom: auto;
                height: 60px;
                border-bottom: 1px solid var(--border);
                border-top: none;
            }

            header {
                display: none;
            }

            .modal {
                align-items: center;
            }

            .modal-content {
                border-radius: 24px;
                width: 90%;
                max-width: 450px;
            }

            main {
                margin-top: 80px;
            }
        }
    </style>
</head>

<body class="dark">
    <!-- Mobile Header -->
    <header>
        <div class="header-content">
            <div class="brand" onclick="location.reload()">
                <div class="logo-icon"><i data-lucide="sparkles" size="18"></i></div>
                <h1>SocialSphere</h1>
            </div>
            <div style="display: flex; gap: 16px;">
                <i data-lucide="moon" id="themeToggle" onclick="toggleTheme()" cursor="pointer"></i>
                <i data-lucide="bell" cursor="pointer"></i>
            </div>
        </div>
    </header>

    <main>
        <!-- Citizens Hub -->
        <section class="citizens-container">
            <div class="citizens-scroll" id="citizensList">
                <!-- Current User first -->
                <div class="citizen-item" onclick="document.getElementById('profileBtn').click()">
                    <div class="citizen-avatar-ring">
                        <div class="citizen-avatar" id="myTopAvatar">?</div>
                    </div>
                    <span class="citizen-name" id="myTopName">You</span>
                </div>
                <!-- Other citizens injected here -->
            </div>
        </section>

        <!-- Feed -->
        <div id="postFeed">
            <!-- Dynamic Posts -->
        </div>
    </main>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <div class="nav-items">
            <div class="nav-item active" onclick="location.reload()"><i data-lucide="home"></i></div>
            <div class="nav-item" onclick="toggleModal('searchModal')"><i data-lucide="search"></i></div>
            <div class="create-btn-circular" onclick="toggleModal('postModal')"><i data-lucide="plus" size="28"></i>
            </div>
            <div class="nav-item"><i data-lucide="heart"></i></div>
            <div class="nav-item" id="profileBtn"><i data-lucide="user"></i></div>
        </div>
    </nav>

    <!-- Create Post Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="close-bar" onclick="closePostModal()"></div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <h2 style="margin: 0;">New Transmission</h2>
                <div onclick="closePostModal()"
                    style="cursor: pointer; width: 32px; height: 32px; border-radius: 50%; background: var(--muted); display: flex; align-items: center; justify-content: center; transition: 0.2s;"
                    onmouseover="this.style.background='var(--accent)'"
                    onmouseout="this.style.background='var(--muted)'">
                    <i data-lucide="x" size="20"></i>
                </div>
            </div>
            <textarea id="postContent" placeholder="What's happening?" rows="4"
                style="background: var(--input-background); border: 1px solid var(--border); border-radius: 12px; transition: 0.2s;"></textarea>

            <div id="uploadZone" onclick="document.getElementById('postFile').click()"
                style="border: 2px dashed var(--border); border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; background: var(--input-background); transition: 0.3s; margin-bottom: 20px; position: relative; overflow: hidden;">
                <div id="uploadPrompt">
                    <i data-lucide="upload-cloud" size="32"
                        style="color: var(--primary); margin-bottom: 12px; opacity: 0.8;"></i>
                    <p style="font-size: 0.95rem; font-weight: 700; color: var(--foreground);">Capture or Select Media
                    </p>
                    <p style="font-size: 0.8rem; color: var(--muted-foreground); margin-top: 6px;">Inject images or
                        videos into the grid</p>
                </div>
                <div id="mediaPreviewContainer"
                    style="display: none; width: 100%; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16/9; background: #000;">
                    <!-- Preview content injected here -->
                    <div id="previewContent"
                        style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                    </div>
                    <div onclick="event.stopPropagation(); clearMedia()"
                        style="position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; backdrop-filter: blur(4px);">
                        <i data-lucide="x" size="18"></i>
                    </div>
                </div>
            </div>

            <input type="file" id="postFile" accept="image/*,video/*" style="display: none;"
                onchange="handleFileSelect(this)">

            <button class="btn-post" id="shareBtn" onclick="submitPost()"
                style="box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);">Share to Feed</button>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content" style="padding: 0; overflow-y: auto; max-height: 90vh;">
            <div
                style="padding: 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card); z-index: 10;">
                <h2 id="viewUsername" style="font-size: 1.1rem;">Username</h2>
                <i data-lucide="x" class="close-modal" style="position: static;"
                    onclick="toggleModal('profileModal')"></i>
            </div>

            <div style="padding: 24px;">
                <div style="display: flex; align-items: center; gap: 24px; margin-bottom: 24px;">
                    <div id="viewAvatarContainer"
                        style="width: 80px; height: 80px; border-radius: 50%; background: var(--secondary); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2rem; flex-shrink: 0;">
                        <span id="viewAvatarLetter">?</span>
                        <img id="viewAvatarImg" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
                    </div>
                    <div style="display: flex; gap: 20px; flex: 1; justify-content: space-around;">
                        <div style="text-align: center;">
                            <div id="postCount" style="font-weight: 700; font-size: 1.1rem;">0</div>
                            <div style="font-size: 0.75rem; color: var(--muted-foreground);">Posts</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-weight: 700; font-size: 1.1rem;">0</div>
                            <div style="font-size: 0.75rem; color: var(--muted-foreground);">Followers</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-weight: 700; font-size: 1.1rem;">0</div>
                            <div style="font-size: 0.75rem; color: var(--muted-foreground);">Following</div>
                        </div>
                    </div>
                </div>

                <div style="margin-bottom: 24px;">
                    <p id="viewRole" style="font-weight: 700; font-size: 0.9rem; margin-bottom: 4px;">Role</p>
                    <p id="viewBio" style="font-size: 0.85rem; color: var(--foreground); opacity: 0.8;">No bio yet.</p>
                </div>

                <div id="selfProfileControls"
                    style="display: none; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                    <button class="btn-post" onclick="showEditProfile()">Edit Profile</button>
                    <button class="btn-post"
                        style="padding: 10px; font-size: 0.85rem; background: var(--muted); color: var(--foreground); border: 1px solid var(--border);"
                        onclick="logout()">Logout</button>
                </div>

                <!-- Edit Profile Form (Hidden) -->
                <div id="editProfileForm"
                    style="display: none; margin-bottom: 24px; border: 1px solid var(--border); padding: 16px; border-radius: 12px;">
                    <h3 style="font-size: 1rem; margin-bottom: 12px;">Update Profile</h3>
                    <textarea id="editBio" placeholder="Tell us about yourself..." rows="3"
                        style="font-size: 0.85rem;"></textarea>
                    <input type="file" id="editAvatarFile" accept="image/*"
                        style="font-size: 0.8rem; margin-bottom: 12px;">
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-post" style="padding: 8px; font-size: 0.85rem;"
                            onclick="saveProfile()">Save</button>
                        <button class="btn-post"
                            style="padding: 8px; font-size: 0.85rem; background: var(--muted); color: var(--foreground);"
                            onclick="hideEditProfile()">Cancel</button>
                    </div>
                </div>

                <div id="adminControls"
                    style="display: none; border-top: 1px solid var(--border); padding-top: 20px; margin-bottom: 20px;">
                    <button class="btn-post" style="background: var(--destructive);" onclick="toggleUserBlock()">Block
                        Citizen</button>
                </div>

                <!-- User Posts Grid -->
                <div style="border-top: 1px solid var(--border); padding-top: 20px;">
                    <h3 style="font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="grid" size="18"></i> Transmissions
                    </h3>
                    <div id="userPostsGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;">
                        <!-- User's posts will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <div class="close-bar" onclick="toggleModal('searchModal')"></div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <h2 style="margin: 0;">Search the Grid</h2>
                <div onclick="toggleModal('searchModal')"
                    style="cursor: pointer; width: 32px; height: 32px; border-radius: 50%; background: var(--muted); display: flex; align-items: center; justify-content: center;">
                    <i data-lucide="x" size="20"></i>
                </div>
            </div>
            <div style="position: relative; margin-bottom: 20px;">
                <input type="text" id="searchInput" placeholder="Enter username..."
                    style="padding-left: 44px; margin-bottom: 0;">
                <i data-lucide="search" size="18"
                    style="position: absolute; left: 14px; top: 14px; color: var(--muted-foreground);"></i>
            </div>
            <button class="btn-post" onclick="searchUser()">Search Citizen</button>
            <div id="searchError" style="display: none; margin-top: 20px; text-align: center; animation: fadeIn 0.3s;">
                <div
                    style="background: var(--muted); padding: 24px; border-radius: 16px; border: 1px solid var(--border);">
                    <i data-lucide="user-minus" size="48"
                        style="color: var(--destructive); margin-bottom: 12px; opacity: 0.5;"></i>
                    <h3 style="font-size: 1rem; margin-bottom: 4px;">User Not Found</h3>
                    <p style="font-size: 0.8rem; color: var(--muted-foreground);">The citizen you're looking for isn't
                        in our database.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) window.location.href = '/login.html';

        lucide.createIcons();

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('themeToggle').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        function toggleModal(id) {
            const m = document.getElementById(id);
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/login.html';
        }

        document.getElementById('profileBtn').onclick = () => {
            viewProfile(currentUser.id, currentUser.username, currentUser.role);
        };

        async function fetchPosts() {
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                renderFeed(posts);
            } catch (e) { }
        }

        function renderFeed(posts) {
            const feed = document.getElementById('postFeed');
            if (posts.length === 0) {
                feed.innerHTML = `<div style="padding:40px; text-align:center; color:var(--muted-foreground)">No posts yet</div>`;
                return;
            }
            feed.innerHTML = posts.map(post => `
                <article class="post">
                    <div class="post-header">
                        <div class="post-user" onclick="viewProfile(${post.user.id})">
                            <div class="post-avatar">
                                ${post.user.profilePicture ?
                    `<img src="${post.user.profilePicture}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` :
                    post.user.username.charAt(0)
                }
                            </div>
                            <span class="post-username">${post.user.username}</span>
                        </div>
                        <i data-lucide="more-horizontal"></i>
                    </div>
                    ${post.mediaUrl ? `
                        <div class="post-img-container">
                            ${post.mediaType === 'VIDEO' ?
                        `<video src="${post.mediaUrl}" controls style="width:100%; height:100%; object-fit:cover;"></video>` :
                        `<img src="${post.mediaUrl}" onerror="this.parentElement.style.display='none'">`
                    }
                        </div>
                    ` : ''}
                    <div class="post-actions">
                        <div class="action-group">
                            <i data-lucide="heart" onclick="likePost(${post.id})"></i>
                            <i data-lucide="message-circle"></i>
                            <i data-lucide="send"></i>
                        </div>
                        <i data-lucide="bookmark"></i>
                    </div>
                    <div class="post-info">
                        <div class="likes-text">${post.likes.toLocaleString()} likes</div>
                        <div class="caption">
                            <span class="caption-user">${post.user.username}</span>${post.content}
                        </div>
                        ${(post.user.id == currentUser.id || currentUser.role === 'ADMIN') ?
                    `<div style="margin-top:10px; color:var(--destructive); font-size:0.8rem; cursor:pointer" onclick="deletePost(${post.id})">Delete Post</div>` : ''}
                    </div>
                </article>
            `).join('');
            lucide.createIcons();
        }

        function closePostModal() {
            toggleModal('postModal');
            clearMedia();
            document.getElementById('postContent').value = '';
        }

        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;

            const prompt = document.getElementById('uploadPrompt');
            const container = document.getElementById('mediaPreviewContainer');
            const preview = document.getElementById('previewContent');

            const reader = new FileReader();
            reader.onload = function (e) {
                prompt.style.display = 'none';
                container.style.display = 'block';

                if (file.type.startsWith('image/')) {
                    preview.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: contain;">`;
                } else if (file.type.startsWith('video/')) {
                    preview.innerHTML = `<video src="${e.target.result}" controls style="width: 100%; height: 100%; object-fit: contain;"></video>`;
                }
                lucide.createIcons();
            }
            reader.readAsDataURL(file);
        }

        function clearMedia() {
            document.getElementById('postFile').value = '';
            document.getElementById('uploadPrompt').style.display = 'block';
            document.getElementById('mediaPreviewContainer').style.display = 'none';
            document.getElementById('previewContent').innerHTML = '';
        }

        async function submitPost() {
            const content = document.getElementById('postContent').value;
            const fileInput = document.getElementById('postFile');
            const file = fileInput.files[0];

            if (!content) return alert('Captions are required');

            const formData = new FormData();
            formData.append('userId', currentUser.id);
            formData.append('content', content);
            if (file) {
                formData.append('file', file);
            }

            try {
                const btn = document.querySelector('.btn-post');
                btn.disabled = true;
                btn.textContent = 'Uploading...';

                await fetch('/api/posts', {
                    method: 'POST',
                    body: formData
                });

                toggleModal('postModal');
                location.reload();
            } catch (e) {
                alert('Upload failed');
                const btn = document.querySelector('.btn-post');
                btn.disabled = false;
                btn.textContent = 'Share to Feed';
            }
        }

        async function likePost(id) {
            await fetch(`/api/posts/${id}/like`, { method: 'POST' });
            fetchPosts();
        }

        async function deletePost(id) {
            if (confirm('Delete post?')) {
                await fetch(`/api/posts/${id}?userId=${currentUser.id}`, { method: 'DELETE' });
                fetchPosts();
            }
        }

        let viewedUserId = null;
        async function viewProfile(id) {
            viewedUserId = id;
            hideEditProfile(); // Reset edit form visibility

            try {
                const userRes = await fetch(`/users/${id}`);
                const user = await userRes.json();

                document.getElementById('viewUsername').textContent = user.username;
                document.getElementById('viewRole').textContent = user.role;
                document.getElementById('viewBio').textContent = user.bio || "No bio yet.";

                const letter = document.getElementById('viewAvatarLetter');
                const img = document.getElementById('viewAvatarImg');
                if (user.profilePicture) {
                    letter.style.display = 'none';
                    img.src = user.profilePicture;
                    img.style.display = 'block';
                } else {
                    letter.textContent = user.username.charAt(0);
                    letter.style.display = 'block';
                    img.style.display = 'none';
                }

                // Show/hide controls
                document.getElementById('selfProfileControls').style.display = (id == currentUser.id) ? 'flex' : 'none';

                const adminControls = document.getElementById('adminControls');
                if (currentUser.role === 'ADMIN' && user.username !== currentUser.username) {
                    adminControls.style.display = 'block';
                } else {
                    adminControls.style.display = 'none';
                }

                // Fetch user posts
                const postsRes = await fetch(`/api/posts/user/${id}`);
                const posts = await postsRes.json();
                renderUserPosts(posts);

                if (document.getElementById('profileModal').style.display !== 'flex') {
                    toggleModal('profileModal');
                }
            } catch (e) {
                console.error("Failed to load profile", e);
            }
        }

        function renderUserPosts(posts) {
            const grid = document.getElementById('userPostsGrid');
            document.getElementById('postCount').textContent = posts.length;

            if (posts.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 3; padding: 20px; text-align: center; color: var(--muted-foreground); font-size: 0.8rem;">No posts yet</div>`;
                return;
            }

            grid.innerHTML = posts.map(post => `
                <div style="aspect-ratio: 1/1; background: var(--muted); cursor: pointer; overflow: hidden;" onclick="focusPost(${post.id})">
                    ${post.mediaUrl ?
                    (post.mediaType === 'VIDEO' ?
                        `<video src="${post.mediaUrl}" style="width:100%; height:100%; object-fit:cover;"></video>` :
                        `<img src="${post.mediaUrl}" style="width:100%; height:100%; object-fit:cover;">`
                    ) : `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:10px; font-size:0.6rem; text-align:center;">${post.content.substring(0, 30)}...</div>`
                }
                </div>
            `).join('');
        }

        function showEditProfile() {
            document.getElementById('editProfileForm').style.display = 'block';
            document.getElementById('editBio').value = document.getElementById('viewBio').textContent === "No bio yet." ? "" : document.getElementById('viewBio').textContent;
        }

        function hideEditProfile() {
            document.getElementById('editProfileForm').style.display = 'none';
        }

        async function saveProfile() {
            const bio = document.getElementById('editBio').value;
            const fileInput = document.getElementById('editAvatarFile');
            const file = fileInput.files[0];

            const formData = new FormData();
            formData.append('bio', bio);
            if (file) {
                formData.append('file', file);
            }

            try {
                const res = await fetch(`/users/${currentUser.id}/profile`, {
                    method: 'POST',
                    body: formData
                });
                const updatedUser = await res.json();

                // Update local current user if needed (e.g. if we want to cache avatar)
                // localStorage.setItem('currentUser', JSON.stringify(updatedUser));

                viewProfile(currentUser.id); // Refresh view
                hideEditProfile();
            } catch (e) {
                alert("Failed to update profile");
            }
        }

        function focusPost(id) {
            // Optional: Implement post detail view or scroll to post
            toggleModal('profileModal');
            // Logic to find and scroll to post could go here
        }

        async function searchUser() {
            const username = document.getElementById('searchInput').value.trim();
            const errorDiv = document.getElementById('searchError');
            errorDiv.style.display = 'none';

            if (!username) return;

            try {
                const res = await fetch(`/users/search?username=${encodeURIComponent(username)}`);
                if (res.ok) {
                    const text = await res.text();
                    if (!text) {
                        errorDiv.style.display = 'block';
                        return;
                    }
                    const user = JSON.parse(text);
                    if (user && user.id) {
                        toggleModal('searchModal');
                        viewProfile(user.id);
                        document.getElementById('searchInput').value = '';
                    } else {
                        errorDiv.style.display = 'block';
                    }
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.style.display = 'block';
            }
        }

        async function toggleUserBlock() {
            await fetch(`/users/${viewedUserId}/toggle-block`, { method: 'POST' });
            location.reload();
        }

        async function initCitizensHub() {
            try {
                // Fetch all users
                const res = await fetch('/users');
                const users = await res.json();

                const list = document.getElementById('citizensList');

                // Set current user data in the first item
                const me = users.find(u => u.id === currentUser.id);
                if (me) {
                    const myAvatar = document.getElementById('myTopAvatar');
                    if (me.profilePicture) {
                        myAvatar.innerHTML = `<img src="${me.profilePicture}" style="width:100%; height:100%; object-fit:cover;">`;
                    } else {
                        myAvatar.textContent = me.username.charAt(0);
                    }
                }

                // Append other users
                users.forEach(user => {
                    if (user.id === currentUser.id) return;

                    const item = document.createElement('div');
                    item.className = 'citizen-item';
                    item.onclick = () => viewProfile(user.id);

                    item.innerHTML = `
                        <div class="citizen-avatar-ring">
                            <div class="citizen-avatar">
                                ${user.profilePicture ?
                            `<img src="${user.profilePicture}" style="width:100%; height:100%; object-fit:cover;">` :
                            user.username.charAt(0)
                        }
                            </div>
                        </div>
                        <span class="citizen-name">${user.username}</span>
                    `;
                    list.appendChild(item);
                });
            } catch (e) {
                console.error("Failed to init Citizens Hub", e);
            }
        }

        fetchPosts();
        initCitizensHub();
    </script>
</body>

</html>
