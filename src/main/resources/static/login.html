<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect | Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg: #030712;
            --card-bg: rgba(31, 41, 55, 0.4);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Animated Mesh Background */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            filter: blur(80px);
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .splash-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.4);
            animation: pulse 2s infinite;
        }

        .splash-text {
            margin-top: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeIn 1s forwards 0.5s;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 50px rgba(99, 102, 241, 0.4);
            }

            50% {
                transform: scale(1.1);
                box-shadow: 0 0 80px rgba(236, 72, 153, 0.5);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 50px rgba(99, 102, 241, 0.4);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Gateway Container */
        .gateway-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease-out;
        }

        .gateway-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gateway-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 3rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .gateway-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--primary);
            background: rgba(45, 55, 72, 0.6);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: var(--primary);
            transition: all 0.3s ease;
        }

        .gateway-card:hover .icon-box {
            background: var(--primary);
            color: white;
            transform: rotate(-10deg);
        }

        .gateway-card.admin:hover .icon-box {
            background: var(--secondary);
            color: white;
        }

        .gateway-card h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .gateway-card p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Auth Form Overlay */
        #authOverlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-form {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .auth-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .toggle-auth {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .toggle-auth span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .close-auth {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .close-auth:hover {
            color: white;
        }

        /* Admin Specific Styling */
        .admin-theme {
            --primary: var(--secondary);
        }
    </style>
</head>

<body>
    <div class="bg-mesh"></div>

    <!-- Splash Screen -->
    <div id="splash">
        <div class="splash-logo"><i data-lucide="zap" size="48"></i></div>
        <div class="splash-text">SOCIALCONNECT</div>
    </div>

    <!-- Main Gateway -->
    <div class="gateway-container" id="gateway">
        <!-- Admin Card -->
        <div class="gateway-card admin" onclick="openAuth('admin')">
            <div class="icon-box"><i data-lucide="shield-check" size="32"></i></div>
            <h2>Admin Portal</h2>
            <p>Access management controls and system analytics. Authorized personnel only.</p>
            <div
                style="color: var(--secondary); font-weight: 600; display:flex; align-items:center; justify-content:center; gap:8px;">
                Secure Entrance <i data-lucide="lock" size="16"></i>
            </div>
        </div>

        <!-- User Card -->
        <div class="gateway-card" onclick="openAuth('user')">
            <div class="icon-box"><i data-lucide="users" size="32"></i></div>
            <h2>Community</h2>
            <p>Join the movement. Connect with friends and share your world with others.</p>
            <div
                style="color: var(--primary); font-weight: 600; display:flex; align-items:center; justify-content:center; gap:8px;">
                Enter Space <i data-lucide="arrow-right" size="16"></i>
            </div>
        </div>
    </div>

    <!-- Auth Overlay -->
    <div id="authOverlay">
        <div class="auth-form" id="authForm">
            <i data-lucide="x" class="close-auth" onclick="closeAuth()"></i>
            <h1 id="authTitle" style="margin-bottom: 0.5rem; font-size: 2rem;">Welcome Back</h1>
            <p id="authSubtitle" style="color: var(--text-muted); margin-bottom: 2rem;">Please enter your credentials
            </p>

            <form onsubmit="handleSubmit(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn" id="submitBtn">Sign In</button>
            </form>

            <div class="toggle-auth" id="toggleSection">
                Don't have an account? <span onclick="toggleMode()">Sign Up</span>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Splash handling
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('gateway').classList.add('visible');
                }, 800);
            }, 2500); // 2.5s splash
        });

        let currentRole = 'user';
        let isLogin = true;

        function openAuth(role) {
            currentRole = role;
            const overlay = document.getElementById('authOverlay');
            const form = document.getElementById('authForm');
            const title = document.getElementById('authTitle');
            const toggle = document.getElementById('toggleSection');

            if (role === 'admin') {
                form.classList.add('admin-theme');
                title.textContent = 'Admin Login';
                toggle.style.display = 'none';
                isLogin = true;
            } else {
                form.classList.remove('admin-theme');
                title.textContent = 'User Login';
                toggle.style.display = 'block';
                isLogin = true;
            }

            overlay.style.display = 'flex';
        }

        function closeAuth() {
            document.getElementById('authOverlay').style.display = 'none';
        }

        function toggleMode() {
            isLogin = !isLogin;
            const title = document.getElementById('authTitle');
            const btn = document.getElementById('submitBtn');
            const toggle = document.getElementById('toggleSection');

            if (isLogin) {
                title.textContent = 'User Login';
                btn.textContent = 'Sign In';
                toggle.innerHTML = "Don't have an account? <span onclick='toggleMode()'>Sign Up</span>";
            } else {
                title.textContent = 'Create Account';
                btn.textContent = 'Create Member Account';
                toggle.innerHTML = "Already a member? <span onclick='toggleMode()'>Login</span>";
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = 'Transmitting...';

            const endpoint = isLogin ? '/api/auth/login' : '/api/auth/signup';
            const payload = isLogin
                ? { username: user, password: pass }
                : { username: user, password: pass, role: (currentRole === 'admin' ? 'ADMIN' : 'USER') };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('currentUser', JSON.stringify(data));
                    window.location.href = '/index.html';
                } else {
                    alert(data.error || 'Authentication Failed');
                }
            } catch (err) {
                console.error(err);
                alert('Grid connection failure. Is the backend running?');
            } finally {
                btn.disabled = false;
                btn.textContent = isLogin ? 'Sign In' : 'Create Member Account';
            }
        }
    </script>
</body>

</html>
